name: Quest Log
description: Validates a Quest Log data repo on every PR and push, and sends its push notifications, with the rules from the live Quest Log core.
author: lilmuckers
branding:
  icon: flag
  color: green

inputs:
  token:
    description: Token for check runs and PR comments. Needs checks and pull-requests write.
    required: false
    default: ${{ github.token }}

outputs:
  core-version:
    description: The Quest Log core version the run used.
    value: ${{ steps.pointer.outputs.version }}

runs:
  using: composite
  steps:
    - name: Check out the data repo
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0

    # No automatic npm cache: it would land in the user's Actions cache.
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        package-manager-cache: false

    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    # Release commits ship dist/. On @main (the beta channel) it's built here instead.
    - name: Build the action (beta channel only)
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        if [ ! -f dist/index.mjs ]; then
          npm ci --no-audit --no-fund
          npm run build
        fi

    - name: Resolve the Quest Log core
      id: pointer
      shell: bash
      run: node "${{ github.action_path }}/dist/resolve.mjs" pointer

    - name: Restore the core from cache
      if: steps.pointer.outputs.local != 'true'
      id: core-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.pointer.outputs.dir }}
        key: quest-core-${{ steps.pointer.outputs.version }}

    - name: Download and verify the core
      shell: bash
      run: node "${{ github.action_path }}/dist/resolve.mjs" install

    - name: Save the core to cache
      if: steps.pointer.outputs.local != 'true' && steps.core-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.pointer.outputs.dir }}
        key: quest-core-${{ steps.pointer.outputs.version }}

    # Notify dedup state (which pushes went out), on scheduled and dispatch runs only. PR runs
    # need none, and caches they save aren't visible on the default branch anyway.
    - name: Restore the notify state
      if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/quest-notify
        key: quest-notify-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: quest-notify-

    - name: Quest Log
      id: quest
      shell: bash
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        QUEST_CORE_PATH: ${{ steps.pointer.outputs.dir }}
        QUEST_CORE_VERSION: ${{ steps.pointer.outputs.version }}
        QUEST_STATUS_DIR: ${{ runner.temp }}/quest-status
        QUEST_NOTIFY_STATE: ${{ runner.temp }}/quest-notify/state.json
      run: node "${{ github.action_path }}/dist/index.mjs"

    # always(): pushes already sent must stay recorded even when validate fails the job.
    - name: Save the notify state
      if: always() && steps.quest.outputs.notify-state == 'saved'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/quest-notify
        key: quest-notify-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Upload quest-status
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: quest-status
        path: ${{ runner.temp }}/quest-status/status.json
        retention-days: 7
        if-no-files-found: ignore
